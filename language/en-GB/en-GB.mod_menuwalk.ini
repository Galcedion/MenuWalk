MOD_MW_CSSMAP_DESC = "This is an overview of the generated frontend code to make CSS styling easier:<br>Each line shows: <b>HTML-Tag</b>, <i>CSS-classes</i> if available and the (intended use)<p style='color:black;line-height:2;'><b>DIV</b> <i>Entry-class Bootstrap:row</i> (root element of MenuWalk)<br><b style='margin-left:2em;'>DIV</b> <i>Bootstrap:col text-center</i> (area first menu entry)<br><b style='margin-left:4em;'>A</b> <i>Bootstrap:btn btn-outline-info</i> (link first menu entry)<br><b style='margin-left:6em;'>I</b> <i>fa-solid fa-backward-step</i> (Fontawesome first menu entry)<br><b style='margin-left:2em;'>DIV</b> <i>Bootstrap:col text-center</i> (area previous menu entry)<br><b style='margin-left:4em;'>A</b> <i>Bootstrap:btn btn-outline-info</i> (link previous menu entry)<br><b style='margin-left:6em;'>I</b> <i>fa-solid fa-chevron-left</i> (Fontawesome previous menu entry)<br><b style='margin-left:2em;'>DIV</b> <i>Bootstrap:col text-center</i> (area parent menu entry)<br><b style='margin-left:4em;'>A</b> <i>Bootstrap:btn btn-outline-info</i> (link parent menu entry)<br><b style='margin-left:6em;'>I</b> <i>fa-solid fa-chevron-up</i> (Fontawesome parent menu entry)<br><b style='margin-left:2em;'>DIV</b> <i>Bootstrap:col text-center</i> (area next menu entry)<br><b style='margin-left:4em;'>A</b> <i>Bootstrap:btn btn-outline-info</i> (link next menu entry)<br><b style='margin-left:6em;'>I</b> <i>fa-solid fa-chevron-right</i> (Fontawesome next menu entry)<br><b style='margin-left:2em;'>DIV</b> <i>Bootstrap:col text-center</i> (area last menu entry)<br><b style='margin-left:4em;'>A</b> <i>Bootstrap:btn btn-outline-info</i> (link last menu entry)<br><b style='margin-left:6em;'>I</b> <i>fa-solid fa-forward-step</i> (Fontawesome last menu entry)<br></p>"
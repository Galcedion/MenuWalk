MOD_MW_DESC = "<p>Module to navigate the current (sub)menu from within the page content.</p><p>To be displayed the module has to be published and the <b>Menu Assignment</b> setting for the <b>Module Assignment</b> has to include the pages that should display the module.<br>On the individual articles, add the module via the dropdown <b>CMS Content</b> option <b>Module</b>, or use the inline command <b>loadmoduleid</b>.</p>"
